[project]
name = "tmux-manager"
dynamic = ["version"]
description = "Interactive terminal UI for managing tmux sessions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["textual>=1.0"]
keywords = ["tmux", "tui", "terminal", "sessions", "sessionizer"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/cloudnutzer/tm"
Issues = "https://github.com/cloudnutzer/tm/issues"

[project.scripts]
tm = "tmux_manager.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tmux_manager/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tmux_manager"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
